<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperature Graph</title>
<style>
  :root {
    --bg: #f5f7f8; --panel: #ffffff; --ink: #1c2529; --muted: #5f6d73;
    --grid: #e1e6e8; --ok: #2e8b57; --line: #cfd6d9; --err: #d2452b;
    --c1: #2f7fb5; --c2: #d2452b; --c3: #2e8b57; --c4: #b8860b;
    --c5: #7b52ab; --c6: #1b998b; --c7: #c2579a; --c8: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14191c; --panel: #1c2327; --ink: #e8edef; --muted: #93a1a8;
            --grid: #2b353a; --ok: #4cc58a; --line: #37434a; --err: #ff7a5c;
            --c1: #5ea9dc; --c2: #ff7a5c; --c3: #4cc58a; --c4: #e0b84a;
            --c5: #a98bdc; --c6: #4fd1c1; --c7: #e88bc4; --c8: #a3adb5; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  h1 { font-size: 1.25rem; margin: 0 auto 0 0; font-weight: 650; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--ok); }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--c1); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  select { font: inherit; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); }
  .readouts { display: flex; flex-wrap: wrap; gap: 8px 24px; }
  .readout { background: none; border: 0; padding: 2px 0; text-align: left; color: inherit; }
  .readout b { display: block; font-size: 2rem; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--c); }
  .readout span { color: var(--muted); font-size: .9rem; }
  .readout.off { opacity: .4; }
  .readout.off span { text-decoration: line-through; }
  .chart { flex: 1; min-height: 240px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #msg { color: var(--muted); font-size: .9rem; min-height: 1.3em; }
  #msg.err { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>Temperature graph</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="state">Not connected</span></div>
  <label>Window
    <select id="win">
      <option value="30">30 s</option>
      <option value="60" selected>1 min</option>
      <option value="300">5 min</option>
      <option value="1800">30 min</option>
    </select>
  </label>
  <label><input type="checkbox" id="lock"> Lock T1</label>
  <select id="unit" aria-label="Units"><option value="C">°C</option><option value="F">°F</option></select>
  <button id="csv" disabled>Download CSV</button>
  <button id="clear">Clear</button>
  <button id="conn" class="primary">Connect sensor</button>
</header>

<div class="readouts" id="readouts"></div>

<div class="chart"><canvas id="cv"></canvas></div>
<div id="msg">Plug in the Arduino, then select Connect sensor and choose its port. Click a readout to hide or show its line.</div>

<script>
const BAUD = 9600;            // must match Serial.begin() in the sketch
const MAX_POINTS = 200000;
const NUM = /^-?\d+(\.\d+)?$/; // strict number check for each field
const PALETTE = 8;             // number of --c1..--c8 colors; channels cycle through them
let port, reader, keepReading = false;
let data = [];                  // {t: seconds since start, v: [T1, T2, ..., TN] in C}
let t0 = null;
let n = null;                   // channel count, set by the first valid line
let t1Fixed = null;             // first T1 reading while "Lock T1" is checked
const hidden = new Set();       // channel indexes hidden from the graph

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const colorVar = i => '--c' + (i % PALETTE + 1);

function setState(on, text) {
  $('dot').classList.toggle('on', on);
  $('state').textContent = text;
  $('conn').textContent = on ? 'Disconnect' : 'Connect sensor';
}
function msg(text, err) { const m = $('msg'); m.textContent = text; m.classList.toggle('err', !!err); }

const conv = c => $('unit').value === 'F' ? c * 9 / 5 + 32 : c;
const fmt = c => conv(c).toFixed(1);

// ---- readouts ----
function buildReadouts() {
  const box = $('readouts');
  box.innerHTML = '';
  for (let i = 0; i < (n || 0); i++) {
    const el = document.createElement('button');
    el.className = 'readout';
    el.style.setProperty('--c', 'var(' + colorVar(i) + ')');
    el.title = 'Show or hide T' + (i + 1);
    el.innerHTML = '<b>--</b><span>T' + (i + 1) + '</span>';
    el.onclick = () => {
      hidden.has(i) ? hidden.delete(i) : hidden.add(i);
      el.classList.toggle('off', hidden.has(i));
    };
    box.appendChild(el);
  }
}
function showValues(vals) {
  const els = $('readouts').children;
  vals.forEach((v, i) => { if (els[i]) els[i].querySelector('b').textContent = fmt(v) + '°'; });
}

// ---- incoming data ----
function handleLine(line) {
  const parts = line.trim().split(',').map(s => s.trim());
  if (parts.length < 2 || !parts.every(p => NUM.test(p))) return;
  const vals = parts.map(Number);
  if (n === null) { n = vals.length; buildReadouts(); }
  else if (vals.length !== n) return;          // ignore lines with a different channel count
  if ($('lock').checked) {
    if (t1Fixed === null) t1Fixed = vals[0];   // capture first reading after locking
    vals[0] = t1Fixed;
  }
  const now = performance.now() / 1000;
  if (t0 === null) t0 = now;
  data.push({ t: now - t0, v: vals });
  if (data.length > MAX_POINTS) data.shift();
  showValues(vals);
  $('csv').disabled = false;
}

async function connect() {
  if (!('serial' in navigator)) {
    msg('This browser does not support Web Serial. Open this page in Chrome or Edge.', true);
    return;
  }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: BAUD });
  } catch (e) {
    msg(e.name === 'NotFoundError' ? 'No port selected.' :
        'Could not open the port. Close the Arduino IDE serial monitor or plotter and try again.', true);
    return;
  }
  setState(true, 'Connected');
  msg('Connected. The Arduino restarts when the port opens, so data starts in 1 to 2 seconds.');
  keepReading = true;
  readLoop();
}

async function readLoop() {
  const decoder = new TextDecoder();
  let buf = '';
  while (port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n')) >= 0) { handleLine(buf.slice(0, i)); buf = buf.slice(i + 1); }
      }
    } catch (e) {
      if (keepReading) msg('Connection lost. Check the USB cable, then reconnect.', true);
      keepReading = false;
    } finally { reader.releaseLock(); }
  }
  try { await port.close(); } catch (e) {}
  setState(false, 'Not connected');
}

async function disconnect() {
  keepReading = false;
  try { await reader.cancel(); } catch (e) {}
}

$('conn').onclick = () => keepReading ? disconnect() : connect();
$('clear').onclick = () => {
  data = []; t0 = null; n = null; t1Fixed = null; hidden.clear();
  buildReadouts();
  $('csv').disabled = true;
};
$('csv').onclick = () => {
  const head = ['seconds', ...Array.from({ length: n }, (_, i) => 'T' + (i + 1) + '_C')];
  const rows = [head.join(','), ...data.map(d => d.t.toFixed(2) + ',' + d.v.join(','))];
  const url = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'temperature-' + new Date().toISOString().slice(0, 19).replace(/:/g, '-') + '.csv';
  a.click(); URL.revokeObjectURL(url);
};
$('unit').onchange = () => { const d = data[data.length - 1]; if (d) showValues(d.v); };
$('lock').onchange = () => { if (!$('lock').checked) t1Fixed = null; };

// ---- drawing ----
function niceStep(range) {
  const raw = range / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const L = 48, R = 12, T = 12, B = 28, pw = w - L - R, ph = h - T - B;
  const span = +$('win').value;
  const tEnd = data.length ? Math.max(data[data.length - 1].t, span) : span;
  const tStart = tEnd - span;
  const vis = data.filter(d => d.t >= tStart - 1);
  const shown = [];
  for (let i = 0; i < (n || 0); i++) if (!hidden.has(i)) shown.push(i);

  let lo = Infinity, hi = -Infinity;
  for (const d of vis) for (const i of shown) {
    const y = conv(d.v[i]);
    if (y < lo) lo = y;
    if (y > hi) hi = y;
  }
  if (!isFinite(lo)) { lo = 20; hi = 30; }
  if (hi - lo < 2) { const m = (hi + lo) / 2; lo = m - 1; hi = m + 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;

  const X = t => L + (t - tStart) / span * pw;
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * ph;

  ctx.font = '12px system-ui, sans-serif';
  ctx.lineWidth = 1; ctx.strokeStyle = css('--grid'); ctx.fillStyle = css('--muted');
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const step = niceStep(hi - lo);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    const y = Math.round(Y(v)) + .5;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
    ctx.fillText(v.toFixed(step < 1 ? 1 : 0), L - 6, y);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const tstep = span <= 30 ? 5 : span <= 60 ? 10 : span <= 300 ? 60 : 300;
  for (let t = Math.ceil(tStart / tstep) * tstep; t <= tEnd; t += tstep) {
    const x = Math.round(X(t)) + .5;
    ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke();
    ctx.fillText(t >= 60 ? Math.floor(t / 60) + ':' + String(Math.round(t % 60)).padStart(2, '0') : t + 's', x, T + ph + 6);
  }

  ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
  ctx.lineWidth = 2; ctx.lineJoin = 'round';
  for (const i of shown) {
    ctx.strokeStyle = css(colorVar(i)); ctx.beginPath();
    vis.forEach((d, k) => { const x = X(d.t), y = Y(conv(d.v[i])); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  }
  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

if ('serial' in navigator) {
  navigator.serial.addEventListener('disconnect', () => { if (keepReading) { keepReading = false; } });
}
</script>
</body>
</html>
